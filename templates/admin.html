<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽奖管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #333; margin-bottom: 20px; }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .card h2 { font-size: 18px; margin-bottom: 15px; color: #555; }
        textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }
        textarea:focus { border-color: #667eea; outline: none; }
        button {
            background: #667eea;
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover { background: #5568d3; }
        .hint { font-size: 13px; color: #999; margin-top: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: 600; color: #555; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        .stat-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-item .num { font-size: 28px; font-weight: bold; color: #667eea; }
        .stat-item .label { font-size: 13px; color: #999; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎁 抽奖管理后台</h1>

        <div class="card">
            <h2>📊 实时数据</h2>
            <div class="stats-grid" id="statsGrid"></div>
        </div>

        <div class="card">
            <h2>⚙️ 导入数据</h2>
            <p style="margin-bottom:10px;color:#666;">奖品配置（每行一个：奖品名称,数量）</p>
            <textarea id="prizesInput">手机,1
耳机,2
充电宝,2
水杯,2
笔记本,2
钥匙扣,2
贴纸,1</textarea>

            <p style="margin:15px 0 10px;color:#666;">参与者名单（每行一个姓名）</p>
            <textarea id="participantsInput" placeholder="张三&#10;李四&#10;王五&#10;..."></textarea>

            <button onclick="initData()">导入数据</button>
            <p class="hint">注意：导入会清空之前的所有数据，请谨慎操作。奖品总数应为 12 个。</p>
        </div>

        <div class="card">
            <h2>🏆 中奖记录</h2>
            <table>
                <thead>
                    <tr><th>姓名</th><th>奖品</th><th>时间</th></tr>
                </thead>
                <tbody id="winnersTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadStats() {
            const res = await fetch('/api/stats');
            const s = await res.json();
            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-item"><div class="num">${s.total_people}</div><div class="label">总人数</div></div>
                <div class="stat-item"><div class="num">${s.drawn_people}</div><div class="label">已抽奖</div></div>
                <div class="stat-item"><div class="num">${s.total_prizes}</div><div class="label">总奖品</div></div>
                <div class="stat-item"><div class="num">${s.remaining_prizes}</div><div class="label">剩余奖品</div></div>
            `;
        }

        async function loadWinners() {
            const res = await fetch('/api/winners');
            const winners = await res.json();
            document.getElementById('winnersTable').innerHTML = winners.map(w => `
                <tr><td>${w.name}</td><td>${w.prize}</td><td>${w.time}</td></tr>
            `).join('') || '<tr><td colspan="3" style="text-align:center;color:#999;">暂无中奖记录</td></tr>';
        }

        async function initData() {
            const prizeLines = document.getElementById('prizesInput').value.trim().split('\n').filter(Boolean);
            const prizes = prizeLines.map(line => {
                const [name, count] = line.split(',').map(s => s.trim());
                return { name, count: parseInt(count) };
            });

            const participants = document.getElementById('participantsInput').value
                .trim().split('\n').map(s => s.trim()).filter(Boolean);

            if (prizes.length === 0 || participants.length === 0) {
                alert('请填写奖品和参与者名单');
                return;
            }

            const totalPrizes = prizes.reduce((sum, p) => sum + p.count, 0);
            if (!confirm(`即将导入 ${prizes.length} 种奖品（共 ${totalPrizes} 个）和 ${participants.length} 位参与者。此操作会清空现有数据，确定继续？`)) return;

            const res = await fetch('/api/init', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prizes, participants })
            });
            const data = await res.json();
            alert(data.message);
            loadStats();
            loadWinners();
        }

        loadStats();
        loadWinners();
        setInterval(() => { loadStats(); loadWinners(); }, 5000);
    </script>
</body>
</html>
